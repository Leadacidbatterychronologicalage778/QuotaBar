name: Bug 报告
description: 报告可以稳定复现的问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请勿上传密码、Cookie、ChatGPT 登录令牌或其他敏感信息。
  - type: input
    id: version
    attributes:
      label: QuotaBar 版本
      placeholder: 例如 1.0.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS 版本与 Mac 型号
      placeholder: 例如 macOS 15.6，M1 MacBook Air
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请按顺序说明如何触发问题。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可提供已移除敏感信息的日志或截图。
